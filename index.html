<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رحلة إلى المستقبل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lalezar&display=swap">
<style>
/* Layout: one centred column on a night-sky VR grid; HUD coin counter on top, one screen at a time below. */
:root {
  --ink: #060818;
  --panel: #0e1233;
  --panel-2: #171d4a;
  --line: rgba(126, 146, 255, .28);
  --text: #eef1ff;
  --muted: #a9b2e0;
  --cyan: #35e0ff;
  --violet: #8b5cf6;
  --coin: #ffc83d;
  --good: #34d399;
  --bad: #ff6b7a;
  --bronze: #e0955c;
  --silver: #cfd6e6;
  --font-display: 'Lalezar', 'Cairo', system-ui, sans-serif;
  --font-body: 'Cairo', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: #060818; }
body { margin: 0; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  min-height: 100vh;
  overflow-x: hidden;
}
#bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 50% at 80% 0%, rgba(139,92,246,.28), transparent 70%),
    radial-gradient(ellipse 60% 45% at 10% 10%, rgba(53,224,255,.16), transparent 70%),
    var(--ink); }
#bg::before { content: ""; position: absolute; left: -50%; right: -50%; bottom: -10%; height: 55%;
  background-image:
    linear-gradient(rgba(53,224,255,.35) 1px, transparent 1px),
    linear-gradient(90deg, rgba(53,224,255,.35) 1px, transparent 1px);
  background-size: 56px 56px;
  transform: perspective(380px) rotateX(62deg);
  transform-origin: 50% 100%;
  -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 90%);
  mask-image: linear-gradient(to top, #000 10%, transparent 90%);
  opacity: .55; animation: gridmove 6s linear infinite; }
@keyframes gridmove { to { background-position: 0 56px, 56px 0; } }
#bg::after { content: ""; position: absolute; inset: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent),
    radial-gradient(1px 1px at 28% 62%, #cfe, transparent),
    radial-gradient(1.5px 1.5px at 47% 12%, #fff, transparent),
    radial-gradient(1px 1px at 63% 38%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 78% 22%, #dff, transparent),
    radial-gradient(1px 1px at 90% 55%, #fff, transparent),
    radial-gradient(1px 1px at 6% 76%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 35% 30%, #fff, transparent);
  opacity: .8; }

#app { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
img { max-width: 100%; display: block; }

/* HUD */
#hud { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; margin-bottom: 8px; }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 6px 16px 6px 8px; border-radius: 999px;
  background: rgba(14,18,51,.85); border: 1px solid var(--line); font-weight: 800; font-variant-numeric: tabular-nums; }
.pill .lbl { color: var(--muted); font-weight: 600; font-size: .85em; }
#coinCount { font-size: 1.25em; color: var(--coin); min-width: 1.6ch; text-align: center; }
.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.35); } }

.coin { width: 30px; height: 30px; flex: none; border-radius: 50%;
  background: radial-gradient(circle at 35% 28%, #fff6bd, #ffc83d 48%, #c98a0a);
  box-shadow: inset 0 0 0 3px #e9a91c, inset 0 0 0 5px rgba(255,255,255,.35), 0 2px 8px rgba(0,0,0,.5);
  display: grid; place-items: center; color: #9a6200; font-size: 15px; line-height: 1; }
.coin::after { content: "\2605"; }
.coin.big { width: 46px; height: 46px; font-size: 22px; }

/* Screens */
.screen { animation: rise .45s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.25; }
.btn { border: 0; border-radius: 16px; padding: 14px 34px; font-weight: 800; font-size: 1.15em;
  background: linear-gradient(180deg, #5af0ff, #1fb5e6); color: #04122b;
  box-shadow: 0 6px 0 #0d6f93, 0 10px 24px rgba(53,224,255,.3); transition: transform .12s, box-shadow .12s, filter .2s; }
.btn:hover:not(:disabled) { transform: translateY(-2px); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #0d6f93; }
.btn:disabled { background: #2a3066; color: #7c86c4; box-shadow: 0 6px 0 #1a1f48; cursor: not-allowed; }
.btn.gold { background: linear-gradient(180deg, #ffe07a, #ffb020); box-shadow: 0 6px 0 #a56a00, 0 10px 24px rgba(255,200,61,.3); }
.btn.gold:active:not(:disabled) { box-shadow: 0 2px 0 #a56a00; }
.btn.ghost { background: transparent; color: var(--text); border: 2px solid var(--line); box-shadow: none; }
.btn.ghost:hover { border-color: var(--cyan); }

/* Start */
.start { text-align: center; padding-top: 4vh; display: grid; justify-items: center; gap: 18px; }
.hero-ring { position: relative; width: 190px; height: 190px; display: grid; place-items: center; border-radius: 50%;
  background: radial-gradient(circle, rgba(139,92,246,.45), rgba(53,224,255,.08) 65%, transparent 72%); }
.hero-ring::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 2px dashed rgba(53,224,255,.55); animation: spin 18s linear infinite; }
.hero-ring img { height: 150px; width: auto; animation: float 3.4s ease-in-out infinite; filter: drop-shadow(0 0 18px rgba(53,224,255,.55)); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes float { 50% { transform: translateY(-10px); } }
.start h1 { font-size: clamp(2.4rem, 9vw, 4.4rem); background: linear-gradient(90deg, #7cf2ff, #c4a6ff 55%, #ffd76a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.start .sub { color: var(--muted); margin: 0; max-width: 34ch; }
.tag { font-size: .85em; letter-spacing: .02em; color: var(--cyan); font-weight: 700; }
.namebox { width: min(100%, 380px); display: grid; gap: 8px; text-align: start; }
.namebox label { font-weight: 700; }
.namebox input { width: 100%; padding: 14px 18px; border-radius: 14px; border: 2px solid var(--line); background: rgba(6,8,24,.8);
  color: var(--text); font: inherit; font-size: 1.15em; }
.namebox input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(53,224,255,.2); }
.need { color: var(--muted); font-size: .9em; min-height: 1.6em; margin: 0; }

/* Levels */
.top { position: relative; text-align: center; padding: 6px 0 10px; }
.top h2 { font-size: clamp(1.9rem, 6vw, 2.8rem); }
.top h2 span { color: var(--coin); }
.help { position: absolute; top: 0; inset-inline-start: 0; z-index: 5; }
.help > button { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 12px; font-weight: 800;
  background: rgba(14,18,51,.9); border: 1px solid var(--cyan); color: var(--cyan); }
.help > button svg { width: 18px; height: 18px; transition: transform .25s; }
.help > button[aria-expanded="true"] svg { transform: rotate(180deg); }
.panel { margin-top: 8px; width: min(86vw, 420px); text-align: start; padding: 16px 18px; border-radius: 16px;
  background: #0b0f2c; border: 1px solid var(--cyan); box-shadow: 0 18px 50px rgba(0,0,0,.6); }
.panel h3 { font-size: 1.4rem; color: var(--cyan); margin-bottom: 6px; }
.panel ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; font-size: .95em; }
.panel b { color: var(--coin); }
.lead { text-align: center; color: var(--muted); margin: 4px 0 20px; }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.lv { position: relative; display: grid; justify-items: center; gap: 8px; text-align: center; padding: 22px 14px 18px; min-width: 0;
  border-radius: 22px; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 2px solid var(--line); }
.lv .num { font-family: var(--font-display); font-size: 3.2rem; line-height: 1; }
.lv h3 { font-size: 1.45rem; }
.lv p { margin: 0; color: var(--muted); font-size: .9em; }
.lv[data-state="open"], .lv[data-state="replay"] { border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(53,224,255,.12), 0 14px 40px rgba(53,224,255,.2); }
.lv[data-state="open"] .num { color: var(--bronze); }
.lv:nth-child(1) .num { color: var(--bronze); }
.lv:nth-child(2) .num { color: var(--silver); }
.lv:nth-child(3) .num { color: var(--coin); }
.lv[data-state="locked"] { opacity: .62; border-style: dashed; }
.lv[data-state="locked"] .num { color: #6a73b0; }
.lv svg.lock { width: 40px; height: 40px; color: #8f99d8; }
.lv .medal { width: 96px; }
.lv .done { color: var(--good); font-weight: 800; }
.lv .btn { padding: 10px 26px; font-size: 1.05em; }

/* Quiz */
.qhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0 14px; }
.chip { padding: 4px 14px; border-radius: 999px; background: rgba(139,92,246,.22); border: 1px solid rgba(139,92,246,.6); font-weight: 700; font-size: .9em; }
.steps { display: flex; gap: 8px; }
.steps i { width: 34px; height: 10px; border-radius: 6px; background: #252b66; display: block; }
.steps i.on { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
.steps i.now { background: var(--coin); }
.qcard { padding: 22px 20px; border-radius: 22px; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 2px solid var(--line); }
.qcard .worth { display: flex; align-items: center; gap: 8px; color: var(--coin); font-weight: 800; margin-bottom: 6px; }
.qcard h2 { font-size: clamp(1.5rem, 4.6vw, 2.1rem); line-height: 1.5; margin-bottom: 16px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: start; padding: 12px 14px; min-height: 58px; border-radius: 16px;
  background: rgba(6,8,24,.7); border: 2px solid var(--line); transition: border-color .15s, background .15s, transform .12s; }
.opt:hover:not(:disabled) { border-color: var(--cyan); transform: translateX(-3px); }
.opt .ltr { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 800;
  background: #252b66; color: var(--cyan); }
.opt .txt { min-width: 0; overflow-wrap: anywhere; }
.opt.wrong { border-color: var(--bad); background: rgba(255,107,122,.12); opacity: .8; }
.opt.wrong .ltr { background: var(--bad); color: #2a0006; }
.opt.right { border-color: var(--good); background: rgba(52,211,153,.14); }
.opt.right .ltr { background: var(--good); color: #022; }
.opt:disabled { cursor: default; }
.fb { margin-top: 16px; min-height: 0; }
.fb .box { padding: 14px 16px; border-radius: 16px; display: grid; gap: 10px; animation: rise .3s ease; }
.fb .ok { background: rgba(52,211,153,.12); border: 1px solid var(--good); }
.fb .no { background: rgba(255,107,122,.1); border: 1px solid var(--bad); }
.fb strong { font-size: 1.15em; }
.fb .hint { color: #ffd9de; }
.fb .hint b { color: var(--coin); }
.coins { display: flex; flex-wrap: wrap; gap: 8px; }
.coins .coin { animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes pop { from { transform: translateY(-30px) scale(0) rotate(-180deg); opacity: 0; } }
.next { margin-top: 14px; text-align: center; }

/* Medal / final */
.award { text-align: center; display: grid; justify-items: center; gap: 12px; padding-top: 2vh; }
.award h1 { font-size: clamp(2rem, 7vw, 3.2rem); }
.award p { margin: 0; color: var(--muted); max-width: 36ch; }
.award p.big { color: var(--text); font-size: 1.1em; }
.shelf { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.shelf img { width: min(40vw, 250px); }
.shelf img.medal-sm { width: min(34vw, 190px); }
.glow { filter: drop-shadow(0 0 30px rgba(255,200,61,.45)); }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 10px; }
.fall { position: fixed; top: -50px; z-index: 20; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

.robot { width: 118px; flex: none; animation: bob .3s ease-in-out infinite alternate; }
.robot .armL { transform-origin: 44px 92px; animation: clapL .3s ease-in-out infinite alternate; }
.robot .armR { transform-origin: 116px 92px; animation: clapR .3s ease-in-out infinite alternate; }
@keyframes clapL { from { transform: rotate(-18deg); } to { transform: rotate(-83deg); } }
@keyframes clapR { from { transform: rotate(18deg); } to { transform: rotate(83deg); } }
@keyframes bob { to { transform: translateY(-4px); } }
.okrow { display: flex; align-items: center; gap: 14px; }
.oktext { display: grid; gap: 10px; min-width: 0; }
.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }
.fb .redo { display: grid; gap: 12px; justify-items: start; }
.nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.navbtn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 12px; font-weight: 800;
  background: rgba(14,18,51,.9); border: 1px solid var(--line); color: var(--text); }
.navbtn:hover { border-color: var(--cyan); }
.navbtn svg { width: 18px; height: 18px; }
.navbtn.x { width: 44px; height: 44px; padding: 0; justify-content: center; border-radius: 50%; }
.guide { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 2px 0 20px; }
.guide img { height: 120px; width: auto; flex: none; filter: drop-shadow(0 8px 16px rgba(0,0,0,.45)); animation: float 3.4s ease-in-out infinite; }
.bubble { position: relative; margin: 0; padding: 12px 18px; border-radius: 18px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); }
.bubble::before { content: ""; position: absolute; top: 50%; inset-inline-start: -8px; width: 14px; height: 14px; transform: translateY(-50%) rotate(45deg);
  background: var(--panel-2); border-inline-start: 1px solid var(--line); border-bottom: 1px solid var(--line); }
@media (max-width: 640px) {
  body { font-size: 16px; }
  .levels { grid-template-columns: 1fr; }
  .lv { grid-template-columns: 1fr; }
  .top { padding-top: 56px; }
  .help { inset-inline-start: 0; }
  .qcard { padding: 18px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .fall { display: none; }
}
</style>

</head>
<body>
<div id="bg"></div>
<div id="app" dir="rtl" lang="ar">
  <div class="nav" id="nav" hidden>
    <button class="navbtn" id="backBtn" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>رجوع</button>
    <button class="navbtn x" id="closeBtn" type="button" aria-label="العودة إلى الشاشة الأولى" title="الشاشة الأولى"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  </div>
  <div id="hud" hidden>
    <div class="pill" title="مجموع العملات"><span class="coin"></span><span class="lbl">عملاتك</span><span id="coinCount">0</span></div>
    <div class="pill" id="lvLabel" hidden></div>
  </div>
  <main id="screen" aria-live="polite"></main>
</div>

    { q: 'ما التقنية الأنسب لتطوير تطبيق يتعرف على الأشياء ويصفها صوتيًا للمكفوفين؟', o: ['الذكاء الاصطناعي.', 'الواقع الافتراضي.', 'معالجة النصوص.', 'التخزين السحابي.'], a: 0,
      hint: 'التطبيق يجب أن يفهم الصور ويتعرف على الأشياء مثل العقل. فأي تقنية تفكر وتتعلم؟' },
    { q: 'أي العبارات التالية توضح الفرق الصحيح بين VR وAR؟', o: ['كلاهما ينشئ بيئة افتراضية كاملة.', 'VR ينشئ بيئة افتراضية، وAR يضيف عناصر رقمية للعالم الحقيقي.', 'VR وAR يستخدمان في الكتابة فقط.', 'AR يلغي العالم الحقيقي تمامًا.'], a: 1,
      hint: 'تذكر: الأولى تأخذك إلى عالم جديد كليًا، والثانية تضيف أشياء إلى عالمك الحقيقي.' },
    { q: 'أي الاختيارات يحقق أفضل استفادة من التكنولوجيا المستقبلية في التعليم؟', o: ['استخدام تقنية واحدة في جميع الأنشطة.', 'الاستغناء عن الوسائل التكنولوجية.', 'توظيف VR وAR وAI حسب طبيعة النشاط.', 'استخدام التكنولوجيا للترفيه فقط.'], a: 2,
      hint: 'الأفضل أن نختار لكل نشاط التقنية التي تناسبه، لا تقنية واحدة للجميع.' }
  ]}
];
const PRAISE = [
  n => `أحسنت يا ${n}! إجابة صحيحة.`,
  n => `رائع يا ${n}! أنت تتقدم بسرعة.`,
  n => `ممتاز يا ${n}! واصل التقدم.`,
  n => `عمل مذهل يا ${n}! عقلك يسبق الزمن.`,
  n => `يا لك من مستكشف ذكي يا ${n}!`
];
const LETTERS = ['أ', 'ب', 'ج', 'د'];

const S = { name: '', total: 0, done: [false, false, false], level: 0, q: 0, solved: false, helpOpen: false, tries: 0, levelPts: 0, started: false, replay: false };
const $ = id => document.getElementById(id);
const screen = $('screen');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* tiny sounds, only after a tap */
let ac;
function tone(freqs, dur = .12, type = 'triangle', vol = .08) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * dur;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur * 1.6);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur * 1.7);
    });
  } catch (e) {}
}
const sndOk = () => tone([880, 1320], .1);
const sndNo = () => tone([220, 170], .14, 'sawtooth', .05);
const sndWin = () => tone([523, 659, 784, 1047], .14);
let noiseB;
function actx() { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
function noise() {
  const a = actx();
  if (!noiseB) { noiseB = a.createBuffer(1, a.sampleRate * 2, a.sampleRate); const d = noiseB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return noiseB;
}
function clapBurst(t, vol) {
  const a = actx(), s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noise(); f.type = 'bandpass'; f.frequency.value = 1300 + Math.random() * 900; f.Q.value = .9;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + .09);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t, Math.random()); s.stop(t + .12);
}
function sndClap(n = 8) { try { const a = actx(); for (let i = 0; i < n; i++) { clapBurst(a.currentTime + .05 + i * .19, .6); if (i % 2) clapBurst(a.currentTime + .05 + i * .19 + .05, .3); } } catch (e) {} }
function sndSiren() {
  try {
    const a = actx(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = 'sawtooth';
    g.gain.setValueAtTime(.001, t); g.gain.linearRampToValueAtTime(.09, t + .05);
    o.frequency.setValueAtTime(600, t);
    for (let k = 0; k < 3; k++) { o.frequency.linearRampToValueAtTime(1000, t + .3 + k * .6); o.frequency.linearRampToValueAtTime(600, t + .6 + k * .6); }
    g.gain.setValueAtTime(.09, t + 1.7); g.gain.linearRampToValueAtTime(.001, t + 1.85);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 1.9);
  } catch (e) {}
}
function sndCheer() {
  try {
    const a = actx(), t = a.currentTime, dur = 5;
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
    s.buffer = noise(); s.loop = true; f.type = 'bandpass'; f.frequency.value = 1000; f.Q.value = .5;
    g.gain.setValueAtTime(.001, t); g.gain.linearRampToValueAtTime(.35, t + .6); g.gain.setValueAtTime(.35, t + 3.5); g.gain.linearRampToValueAtTime(.001, t + dur);
    lfo.frequency.value = 6; lg.gain.value = .08; lfo.connect(lg); lg.connect(g.gain); lfo.start(t); lfo.stop(t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur);
    for (let i = 0; i < 42; i++) clapBurst(t + .3 + Math.random() * 3.8, .25);
    [.2, .9, 1.7].forEach(d => {
      const o = a.createOscillator(), og = a.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(2600, t + d); o.frequency.linearRampToValueAtTime(3400, t + d + .35);
      og.gain.setValueAtTime(.001, t + d); og.gain.linearRampToValueAtTime(.05, t + d + .05); og.gain.linearRampToValueAtTime(.001, t + d + .4);
      o.connect(og); og.connect(a.destination); o.start(t + d); o.stop(t + d + .45);
    });
  } catch (e) {}
}
const robotSVG = () => `<svg class="robot" viewBox="0 0 160 170" aria-hidden="true">
  <line x1="80" y1="12" x2="80" y2="26" stroke="#35e0ff" stroke-width="4"/><circle cx="80" cy="9" r="6" fill="#ffc83d"/>
  <rect x="48" y="26" width="64" height="48" rx="14" fill="#171d4a" stroke="#35e0ff" stroke-width="4"/>
  <circle cx="66" cy="48" r="7" fill="#35e0ff"/><circle cx="94" cy="48" r="7" fill="#35e0ff"/>
  <path d="M66 61 Q80 70 94 61" stroke="#ffc83d" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="40" y="78" width="80" height="54" rx="14" fill="#0e1233" stroke="#8b5cf6" stroke-width="4"/>
  <circle cx="80" cy="105" r="9" fill="#ffc83d"/>
  <rect x="56" y="136" width="16" height="26" rx="6" fill="#171d4a" stroke="#8b5cf6" stroke-width="3"/><rect x="88" y="136" width="16" height="26" rx="6" fill="#171d4a" stroke="#8b5cf6" stroke-width="3"/>
  <g class="armL"><path d="M44 92 L30 126" stroke="#35e0ff" stroke-width="9" stroke-linecap="round"/><circle cx="30" cy="128" r="9" fill="#ffc83d"/></g>
  <g class="armR"><path d="M116 92 L130 126" stroke="#35e0ff" stroke-width="9" stroke-linecap="round"/><circle cx="130" cy="128" r="9" fill="#ffc83d"/></g>
</svg>`;

function hud(show, label) {
  $('hud').hidden = !show;
  const l = $('lvLabel');
  l.hidden = !label; l.textContent = label || '';
}
function setCoins(bump) {
  const c = $('coinCount'); c.textContent = S.total;
  if (bump) { c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
}
let navBack = null;
function nav(fn) { navBack = fn; $('nav').hidden = !fn; }
function dropLevel() { if (S.levelPts) { S.total -= S.levelPts; S.levelPts = 0; } }
$('backBtn').addEventListener('click', () => { dropLevel(); if (navBack) navBack(); });
$('closeBtn').addEventListener('click', () => { dropLevel(); renderStart(); });
function show(html) { screen.innerHTML = '<div class="screen">' + html + '</div>'; window.scrollTo(0, 0); }

const lockSVG = `<svg class="lock" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><rect x="7" y="17" width="26" height="18" rx="5" fill="rgba(143,153,216,.2)"/><path d="M12 17 V12 A8 8 0 0 1 28 12 V17"/><circle cx="20" cy="26" r="2.4" fill="currentColor"/></svg>`;
const chevSVG = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l6 6 6-6"/></svg>`;

/* ---------- Start ---------- */
function renderStart() {
  hud(false); nav(null);
  show(`<section class="start">
    <div class="hero-ring"><img src="${IMG.ROBOT}" alt=""></div>
    <span class="tag">تكنولوجيا المعلومات والاتصالات · الصف السادس الابتدائي</span>
    <h1>رحلة إلى المستقبل</h1>
    <p class="sub">اكتشف الواقع الافتراضي والواقع المعزز، واجمع العملات والميداليات حتى تفوز بكأس التفوق.</p>
    <form class="namebox" id="nameForm" autocomplete="off">
      <label for="nameInput">اكتب اسمك</label>
      <input id="nameInput" type="text" maxlength="20" placeholder="اسمك هنا" value="${esc(S.name)}">
      <p class="need" id="need"></p>
      <button class="btn" id="goBtn" type="submit">ابدأ الرحلة</button>
    </form>
  </section>`);
  const inp = $('nameInput'), btn = $('goBtn'), need = $('need');
  const sync = () => {
    const ok = inp.value.trim().length > 0;
    btn.disabled = !ok;
    need.textContent = ok ? '' : 'اكتب اسمك أولًا ليفتح زر البداية.';
  };
  inp.addEventListener('input', sync); sync();
  $('nameForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    if (!S.started || v !== S.name) { S.total = 0; S.done = [false, false, false]; }
    S.name = v; S.started = true; S.helpOpen = false;
    sndOk(); renderLevels();
  });
  inp.focus();
}

/* ---------- Levels ---------- */
function unlocked(i) { return i === 0 || S.done[i - 1]; }
function renderLevels() {
  hud(true); nav(renderStart); setCoins(false);
  const rules = `<ul>
    <li>اللعبة فيها 3 مستويات، وكل مستوى أصعب من الذي قبله.</li>
    <li>في كل مستوى 5 أسئلة.</li>
    <li><b>المستوى الأول:</b> كل سؤال بنقطة. إذا جمعت 5 نقاط تحصل على الميدالية البرونزية ويُفتح المستوى الثاني.</li>
    <li><b>المستوى الثاني:</b> كل سؤال بنقطتين. إذا صار مجموعك 15 نقطة تحصل على الميدالية الفضية ويُفتح المستوى الثالث.</li>
    <li><b>المستوى الثالث:</b> كل سؤال بخمس نقاط. إذا صار مجموعك 40 نقطة تحصل على الميدالية الذهبية وكأس التفوق.</li>
    <li>كل إجابة صحيحة تعطيك عملات ذهبية.</li>
    <li>إذا أخطأت في سؤال، لك محاولة واحدة أخرى ومعها تلميح.</li>
    <li>إذا أخطأت مرة ثانية في نفس السؤال، يبدأ المستوى من أوله.</li>
  </ul>`;
  const all = S.done.every(Boolean);
  const cards = LEVELS.map((L, i) => {
    const st = S.done[i] ? 'replay' : unlocked(i) ? 'open' : 'locked';
    const meta = `5 أسئلة · كل سؤال ${L.pts === 1 ? 'بنقطة' : L.pts === 2 ? 'بنقطتين' : 'بخمس نقاط'}`;
    let foot;
    if (st === 'replay') foot = `<img class="medal" src="${IMG[L.medal]}" alt="${L.medalName}"><button class="btn" data-go="${i}">العب مرة أخرى</button>`;
    else if (st === 'done') foot = `<img class="medal shot" src="${IMG[L.medal]}" alt="${L.medalName}"><span class="done">تم الإنجاز</span>`;
    else if (st === 'open') foot = `<button class="btn" data-go="${i}">ابدأ</button>`;
    else foot = `${lockSVG}<p>مقفول. أكمل المستوى ${LEVELS[i - 1].ord} لتفتحه.</p>`;
    return `<article class="lv" data-state="${st}"><div class="num">${i + 1}</div><h3>${L.name}</h3><p>${meta}</p>${foot}</article>`;
  }).join('');
  show(`<section>
    <div class="top">
      <div class="help">
        <button id="helpBtn" aria-expanded="${S.helpOpen}" aria-controls="helpPanel">التعليمات ${chevSVG}</button>
        <div class="panel" id="helpPanel" ${S.helpOpen ? '' : 'hidden'}><h3>طريقة اللعب</h3>${rules}</div>
      </div>
      <h2>مرحبا يا <span id="who"></span></h2>
    </div>
    <div class="guide"><img src="${IMG.ROBOT}" alt=""><p class="bubble">${all ? 'أنهيت كل المستويات! يمكنك دخول أي مستوى تريده.' : 'اختر مستواك وابدأ المغامرة.'}</p></div>
    <div class="levels">${cards}</div>
  </section>`);
  $('who').textContent = S.name;
  $('helpBtn').addEventListener('click', () => {
    S.helpOpen = !S.helpOpen;
    $('helpBtn').setAttribute('aria-expanded', S.helpOpen);
    $('helpPanel').hidden = !S.helpOpen;
  });
  screen.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { S.level = +b.dataset.go; S.q = 0; S.levelPts = 0; S.helpOpen = false; S.replay = S.done[S.level]; renderQuiz(); }));
}

/* ---------- Quiz ---------- */
function renderQuiz() {
  const L = LEVELS[S.level], Q = L.qs[S.q];
  S.solved = false; S.tries = 0; nav(renderLevels);
  hud(true, `المستوى ${L.ord}: ${L.name}`); setCoins(false);
  const steps = L.qs.map((_, i) => `<i class="${i < S.q ? 'on' : i === S.q ? 'now' : ''}"></i>`).join('');
  const worth = L.pts === 1 ? 'نقطة واحدة' : L.pts === 2 ? 'نقطتان' : '5 نقاط';
  show(`<section>
    <div class="qhead"><span class="chip">السؤال ${S.q + 1} من 5</span><div class="steps" aria-hidden="true">${steps}</div></div>
    <div class="qcard">
      <div class="worth"><span class="coin"></span>قيمة السؤال: ${worth}</div>
      <h2>${esc(Q.q)}</h2>
      <div class="opts">${Q.o.map((t, i) => `<button class="opt" data-i="${i}"><span class="ltr">${LETTERS[i]}</span><span class="txt">${esc(t)}</span></button>`).join('')}</div>
      <div class="fb" id="fb" role="status" aria-live="polite"></div>
    </div>
  </section>`);
  screen.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(+b.dataset.i, b)));
}
function answer(i, btn) {
  if (S.solved) return;
  const L = LEVELS[S.level], Q = L.qs[S.q], fb = $('fb');
  if (i === Q.a) {
    S.solved = true;
    if (!S.replay) { S.total += L.pts; S.levelPts += L.pts; }
    setCoins(true); sndOk(); sndClap(8);
    screen.querySelectorAll('.opt').forEach(b => { b.disabled = true; });
    btn.classList.add('right');
    const coins = Array.from({ length: L.pts }, (_, k) => `<span class="coin big" style="animation-delay:${k * .09}s"></span>`).join('');
    const last = S.q === 4;
    fb.innerHTML = `<div class="box ok"><div class="okrow">${robotSVG()}<div class="oktext"><strong id="praise"></strong><div class="coins" aria-label="حصلت على ${L.pts} عملة">${coins}</div><span>${S.replay ? 'إجابة صحيحة! هذا تدريب، ومجموع عملاتك محفوظ كما هو.' : 'حصلت على ' + (L.pts === 1 ? 'عملة واحدة' : L.pts === 2 ? 'عملتين' : '5 عملات') + '.'}</span></div></div></div>
      <div class="next"><button class="btn gold" id="nextBtn">${last ? 'إنهاء المستوى' : 'السؤال التالي'}</button></div>`;
    $('praise').textContent = PRAISE[S.q % PRAISE.length](S.name);
    $('nextBtn').addEventListener('click', () => { S.q++; S.q < 5 ? renderQuiz() : finishLevel(); });
    $('nextBtn').focus();
    return;
  }
  S.tries++;
  sndSiren();
  const card = document.querySelector('.qcard');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  btn.classList.add('wrong'); btn.disabled = true;
  if (S.tries === 1) {
    fb.innerHTML = `<div class="box no"><strong id="retry"></strong><span class="hint"><b>تلميح:</b> ${esc(Q.hint)}</span></div>`;
    $('retry').textContent = `حاول مرة أخرى يا ${S.name}. هذه محاولتك الأخيرة في هذا السؤال.`;
  } else {
    S.solved = true;
    screen.querySelectorAll('.opt').forEach(b => { b.disabled = true; });
    fb.innerHTML = `<div class="box no redo"><strong id="retry"></strong><span>لا بأس، المحاولة تصنع البطل. سنعيد المستوى من أوله.</span><button class="btn" id="redoBtn">إعادة المستوى</button></div>`;
    $('retry').textContent = `أخطأت مرتين يا ${S.name}.`;
    $('redoBtn').addEventListener('click', () => { S.total -= S.levelPts; S.levelPts = 0; S.q = 0; renderQuiz(); });
    $('redoBtn').focus();
  }
}

/* ---------- Awards ---------- */
function confetti() {
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('span');
    c.className = 'coin fall';
    c.style.left = Math.random() * 96 + 'vw';
    c.style.animationDuration = (2.4 + Math.random() * 2.2) + 's';
    c.style.animationDelay = (Math.random() * 1.2) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6500);
  }
}
function finishLevel() {
  const L = LEVELS[S.level];
  S.done[S.level] = true; S.levelPts = 0;
  hud(true); nav(renderLevels); setCoins(false);
  sndWin(); confetti(); if (S.level === 2) sndCheer();
  if (S.level < 2) {
    const next = LEVELS[S.level + 1];
    show(`<section class="award">
      <img class="shot" src="${IMG[L.medal]}" alt="${L.medalName}" style="width:min(70vw,320px)">
      <h1 id="t"></h1>
      <p class="big">حصلت على ${L.medalName} وجمعت ${S.total} عملة.</p>
      <p>${S.replay ? 'أنهيت المستوى مرة أخرى. يمكنك إعادة أي مستوى اجتزته.' : 'تم فتح المستوى ' + next.ord + ': ' + next.name + '. هل أنت مستعد؟'}</p>
      <div class="actions"><button class="btn gold" id="cont">${S.replay ? 'العودة إلى المستويات' : 'متابعة الرحلة'}</button></div>
    </section>`);
    $('t').textContent = `مبروك يا ${S.name}!`;
    $('cont').addEventListener('click', renderLevels);
    $('cont').focus();
  } else {
    show(`<section class="award">
      <div class="shelf">
        ${robotSVG()}
        <img class="shot glow" src="${IMG.TROPHY}" alt="كأس التفوق">
        <img class="shot medal-sm" src="${IMG.GOLD}" alt="الميدالية الذهبية">
        ${robotSVG()}
      </div>
      <h1 id="t"></h1>
      <p class="big">حصلت على الميدالية الذهبية وكأس التفوق بمجموع ${S.total} عملة.</p>
      <p>أنت الآن خبير في الواقع الافتراضي والواقع المعزز.</p>
      <div class="actions">
        <button class="btn gold" id="again">إعادة اللعب</button>
        <button class="btn ghost" id="leave">مغادرة اللعبة</button>
      </div>
    </section>`);
    $('t').textContent = `أنت بطل الرحلة يا ${S.name}!`;
    $('again').addEventListener('click', () => { S.total = 0; S.done = [false, false, false]; S.level = 0; S.q = 0; S.started = false; renderStart(); });
    $('leave').addEventListener('click', leave);
  }
}
function leave() {
  hud(false); nav(renderLevels);
  show(`<section class="award" style="padding-top:12vh">
    <h1 id="t"></h1>
    <p class="big">شكرًا لك على اللعب. نراك في رحلة جديدة.</p>
    <p>يمكنك الآن إغلاق هذه الصفحة.</p>
  </section>`);
  $('t').textContent = `إلى اللقاء يا ${S.name}!`;
  try { window.close(); } catch (e) {}
}

renderStart();
</script>
